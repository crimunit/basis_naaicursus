<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basis Naaicursus</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: #f5f7fb;
    color: #333;
}

header {
    background: linear-gradient(135deg,#6d28d9,#2563eb);
    color: white;
    text-align: center;
    padding: 40px 20px;
}

h1 {
    margin: 0;
    font-size: 2.5rem;
}

.subtitle {
    margin-top: 10px;
    opacity: 0.9;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
}

.chapter {
    background: white;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.chapter-title {
    background: #4338ca;
    color: white;
    padding: 15px 20px;
    font-size: 1.2rem;
    font-weight: bold;
}

.pdf-list {
    padding: 12px;
}

.pdf-link {
    display: block;
    padding: 12px;
    margin: 8px 0;
    text-decoration: none;
    color: #333;
    background: #f8fafc;
    border-radius: 8px;
    transition: all .2s ease;
}

.pdf-link:hover {
    background: #dbeafe;
    transform: translateX(4px);
}

.empty {
    padding: 15px;
    color: #777;
    font-style: italic;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 8px;
}
</style>

</head>
<body>

<header>
    <h1>🧵 Basis Naaicursus</h1>
    <div class="subtitle">
        Lesmateriaal en oefeningen
    </div>
</header>

<div class="container" id="content">
    <p>Laden...</p>
</div>

<script>

function cleanName(name) {

    return name
        .replace(/^\d+_/, "")
        .replace(/\.pdf$/i, "")
        .replaceAll("_", " ");
}

fetch("./data.json")
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Kan data.json niet laden (" +
                response.status +
                ")"
            );
        }

        return response.json();
    })
    .then(data => {

        const container =
            document.getElementById("content");

        container.innerHTML = "";

        data.forEach(folder => {

            const chapter =
                document.createElement("div");

            chapter.className = "chapter";

            let html = `
                <div class="chapter-title">
                    📁 ${cleanName(folder.folder)}
                </div>
                <div class="pdf-list">
            `;

            if (!folder.files || folder.files.length === 0) {

                html += `
                    <div class="empty">
                        Nog geen documenten beschikbaar
                    </div>
                `;
            }
            else {

                folder.files.forEach(file => {

                    html += `
                        <a
                            class="pdf-link"
                            href="${encodeURIComponent(folder.folder)}/${encodeURIComponent(file)}"
                            target="_blank">
                            📄 ${cleanName(file)}
                        </a>
                    `;
                });
            }

            html += "</div>";

            chapter.innerHTML = html;

            container.appendChild(chapter);
        });
    })
    .catch(error => {

        console.error(error);

        document.getElementById("content").innerHTML =
            `<div class="error">
                Fout bij laden van data.json:<br>
                ${error.message}
            </div>`;
    });

</script>

</body>
</html>
